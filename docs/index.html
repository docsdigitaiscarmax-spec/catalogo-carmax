<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f0f10">
<meta name="referrer" content="no-referrer">
<title>Carmax Santos · Estoque</title>

<meta property="og:title" content="Carmax Santos · Estoque atualizado">

<style>
:root{--red:#db0b14;--red2:#a00910;--ink:#121214;--mut:#6b6b73;--bg:#f4f4f6;--card:#fff;--line:#e6e6ea;--wa:#1fae55;
--top:env(safe-area-inset-top,0px);--bot:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
body{overflow-x:hidden}
button,input,select{font:inherit;color:inherit}
img{display:block}
/* barra do app */
.app-bar{position:sticky;top:0;z-index:20;background:#0f0f10;color:#fff;padding:calc(10px + var(--top)) 16px 12px}
.brand{display:flex;align-items:center;gap:10px}
.logo{font-weight:900;font-size:21px;letter-spacing:.04em}.logo b{color:var(--red)}
.brand small{display:block;font-size:11.5px;color:#a9a9b2;font-weight:500}
.brand .wa-top{margin-left:auto;display:flex;align-items:center;gap:6px;background:var(--wa);color:#fff;text-decoration:none;font-weight:700;font-size:13px;padding:8px 12px;border-radius:999px}
.search{margin-top:12px;display:flex;align-items:center;gap:8px;background:#1f1f22;border-radius:12px;padding:0 12px;height:44px}
.search svg{flex:none;opacity:.6}
.search input{flex:1;background:none;border:0;outline:0;color:#fff;font-size:16px;height:100%}
.search input::placeholder{color:#8d8d96}
.search .clear{border:0;background:none;color:#aaa;font-size:20px;width:28px;display:none}
.tabs{display:flex;gap:4px;margin-top:12px;background:#1f1f22;border-radius:12px;padding:4px}
.tabs button{flex:1;border:0;background:none;color:#b8b8c0;font-weight:700;font-size:14.5px;padding:9px 6px;border-radius:9px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.tabs button.on{background:#fff;color:var(--ink)}
.tabs button.on[data-l="outlet"]{background:var(--red);color:#fff}
.tabs .n{font-size:12px;opacity:.7;font-weight:600}
.otag{display:inline-block;background:var(--ink);color:#fff;font-size:10.5px;font-weight:800;letter-spacing:.06em;padding:2px 6px;border-radius:4px;margin-left:6px;vertical-align:2px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 4px;scrollbar-width:none;background:var(--bg)}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-size:13.5px;font-weight:600;color:#33333a;cursor:pointer}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip .n{opacity:.55;font-weight:500;margin-left:4px}
.toolbar{display:flex;align-items:center;gap:10px;padding:8px 16px 4px;font-size:13px;color:var(--mut)}
.toolbar select{margin-left:auto;border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 8px;font-size:13.5px;font-weight:600}
/* lista */
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:14px;padding:10px 16px calc(28px + var(--bot));max-width:1240px;margin:0 auto}
.card{background:var(--card);border-radius:18px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.05);cursor:pointer;text-align:left;border:0;display:flex;flex-direction:column;transition:transform .15s}
.card:active{transform:scale(.985)}
.ph{position:relative;aspect-ratio:3/2;background:#e9e9ee;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover}
.tag{position:absolute;top:10px;left:10px;background:var(--red);color:#fff;font-size:11.5px;font-weight:800;padding:4px 8px;border-radius:6px}
.cnt{position:absolute;right:10px;bottom:10px;background:rgba(0,0,0,.62);color:#fff;font-size:12px;font-weight:600;padding:4px 8px;border-radius:999px;display:flex;align-items:center;gap:5px}
.bd{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.mk{font-size:11.5px;font-weight:800;color:var(--red);letter-spacing:.06em}
.nm{font-size:16px;font-weight:700;line-height:1.25}
.meta{display:flex;flex-wrap:wrap;gap:6px}
.meta span{background:#f2f2f5;color:#4a4a52;border-radius:6px;padding:2px 8px;font-size:12.5px;white-space:nowrap}
.pr{font-size:22px;font-weight:850;margin-top:auto;padding-top:4px;white-space:nowrap}
.empty{grid-column:1/-1;text-align:center;color:var(--mut);padding:60px 20px}
.skel{height:330px;border-radius:18px;background:linear-gradient(90deg,#ececf0,#f7f7f9,#ececf0);background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
footer{text-align:center;color:var(--mut);font-size:12.5px;padding:0 16px calc(24px + var(--bot))}
/* detalhe */
.sheet{position:fixed;inset:0;z-index:50;background:#fff;overflow-y:auto;transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1);overscroll-behavior:contain}
.sheet.open{transform:none}
.sh-top{position:sticky;top:0;z-index:3;display:flex;align-items:center;justify-content:space-between;padding:calc(10px + var(--top)) 12px 10px;pointer-events:none}
.rb{pointer-events:auto;width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.92);box-shadow:0 2px 8px rgba(0,0,0,.18);display:grid;place-items:center;cursor:pointer}
.gal{margin-top:calc(-62px - var(--top));position:relative;background:#111}
.track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.track::-webkit-scrollbar{display:none}
.track img{flex:none;width:100%;aspect-ratio:4/3;object-fit:cover;scroll-snap-align:center;max-height:70vh}
.gnav{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;border:0;background:rgba(0,0,0,.45);color:#fff;font-size:22px;cursor:pointer;display:none}
.gnav.p{left:10px}.gnav.n{right:10px}
@media(hover:hover){.gnav{display:block}}
@media(min-width:760px){.track img{object-fit:contain;max-height:72vh;height:72vh;aspect-ratio:auto}}
.gcount{position:absolute;right:12px;bottom:12px;background:rgba(0,0,0,.62);color:#fff;font-size:12.5px;font-weight:700;padding:4px 10px;border-radius:999px}
.thumbs{display:flex;gap:6px;overflow-x:auto;padding:8px 12px;background:#111;scrollbar-width:none}
.thumbs::-webkit-scrollbar{display:none}
.thumbs img{flex:none;width:64px;height:48px;object-fit:cover;border-radius:6px;opacity:.5;cursor:pointer;border:2px solid transparent}
.thumbs img.on{opacity:1;border-color:#fff}
.dt{max-width:760px;margin:0 auto;padding:18px 16px calc(110px + var(--bot))}
.dt .mk{font-size:12px}
.dt h1{font-size:23px;line-height:1.2;margin:4px 0 6px}
.dt .pr{font-size:30px;padding:0}
.specs{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin:18px 0}
.spec{background:#f5f5f8;border-radius:14px;padding:12px}
.spec small{display:block;color:var(--mut);font-size:12px}
.spec b{font-size:15.5px}
.dt h2{font-size:16px;margin:22px 0 10px}
.opc{display:flex;flex-wrap:wrap;gap:8px}
.opc span{border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:13px}
.seller{display:flex;align-items:center;gap:12px;margin-top:24px;padding:14px;border-radius:14px;background:#f5f5f8}
.av{width:44px;height:44px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:800}
.seller small{display:block;color:var(--mut);font-size:12.5px}
.site{display:inline-block;margin-top:14px;color:var(--mut);font-size:13px}
.cta{position:fixed;left:0;right:0;bottom:0;z-index:60;background:#fff;border-top:1px solid var(--line);padding:10px 16px calc(10px + var(--bot));display:flex;align-items:center;gap:12px;transform:translateY(110%);transition:transform .28s}
.cta.open{transform:none}
.cta .pv{font-size:12px;color:var(--mut);line-height:1.2}.cta .pv b{display:block;font-size:19px;color:var(--ink)}
.cta a{margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--wa);color:#fff;text-decoration:none;font-weight:800;padding:13px 18px;border-radius:14px;font-size:15px;white-space:nowrap}
.toast{position:fixed;left:50%;bottom:calc(90px + var(--bot));transform:translate(-50%,20px);background:#222;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:.25s;z-index:80;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
/* tela cheia */
.zoom{position:fixed;inset:0;z-index:90;background:#000;display:none}
.zoom.open{display:block}
.zoom .track{height:100%}
.zoom .track img{height:100%;max-height:none;aspect-ratio:auto;object-fit:contain}
.zoom .rb{position:absolute;top:calc(12px + var(--top));right:12px;z-index:2}
/* selos */
.badges{position:absolute;top:10px;left:10px;display:flex;flex-direction:column;align-items:flex-start;gap:5px}
.badges .tag{position:static}
.tag.novo{background:#0b8a46}
.tag.baixou{background:#ffb000;color:#1a1300}
.old{font-size:13.5px;color:var(--mut);text-decoration:line-through;font-weight:500;margin-right:6px}
.chip.nov{border-color:#0b8a46;color:#0b8a46}.chip.nov.on{background:#0b8a46;color:#fff}
.dt .tags{display:flex;gap:6px;margin:8px 0 2px}.dt .tags .tag{position:static}
/* simulador */
.sim{margin-top:22px;border:1px solid var(--line);border-radius:16px;padding:16px}
.sim h2{margin:0 0 12px}
.sim label{display:block;font-size:13px;color:var(--mut);margin-bottom:6px}
.sim .ent{display:flex;align-items:center;gap:10px}
.sim input[type=range]{flex:1;accent-color:var(--red);height:32px}
.sim .ev{min-width:112px;text-align:right;font-weight:800;white-space:nowrap}
.sim .pz{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:14px 0}
.sim .pz button{height:42px;border-radius:10px;border:1px solid var(--line);background:#fff;font-weight:700;cursor:pointer}
.sim .pz button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.sim .res{background:#f5f5f8;border-radius:12px;padding:14px;text-align:center}
.sim .res b{display:block;font-size:26px;line-height:1.2}
.sim .res small{color:var(--mut);font-size:12.5px}
.sim .aviso{font-size:11.5px;color:var(--mut);margin-top:10px;line-height:1.4}
/* pop-up de Natal */
.promo{position:fixed;inset:0;z-index:100;background:rgba(10,10,12,.62);display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(3px)}
.promo.open{display:flex;animation:pf .25s ease}
@keyframes pf{from{opacity:0}}
.pbox{width:min(400px,100%);background:#fff;border-radius:22px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.35);position:relative;animation:pu .35s cubic-bezier(.2,.8,.2,1)}
@keyframes pu{from{transform:translateY(24px) scale(.97)}}
.pban{position:relative;height:200px;background:radial-gradient(120% 90% at 50% 0%,#e3141d 0%,#a00910 55%,#5c0509 100%);overflow:hidden}
.pban svg{position:absolute;inset:0;width:100%;height:100%}
.pclose{position:absolute;top:10px;right:10px;z-index:2;width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.9);font-size:20px;line-height:1;cursor:pointer}
.ptxt{padding:20px 22px 22px;text-align:center}
.ptxt h3{font-size:26px;line-height:1.1;margin-bottom:8px}
.ptxt p{color:#55555d;font-size:15px}
.pbtn{display:flex;flex-direction:column;gap:8px;margin-top:18px}
.pbtn a,.pbtn button{display:flex;align-items:center;justify-content:center;gap:8px;height:48px;border-radius:12px;font-weight:800;font-size:15px;text-decoration:none;border:0;cursor:pointer}
.pbtn a{background:var(--wa);color:#fff}
.pbtn button{background:#f1f1f4;color:var(--ink)}
@media(prefers-reduced-motion:reduce){.promo.open,.pbox{animation:none}}
@media(prefers-reduced-motion:reduce){.sheet,.cta{transition:none}}
</style>
</head>

<script>
{
const TAXA_MES = 1.99; // % ao mês usada no simulador (estimativa)
const SITE = location.origin + location.pathname.replace(/[^/]*$/, '');
const linkCarro = c => SITE + 'c/' + c.id + '.html';
const hojeMs = Date.now(), dias = d => d ? (hojeMs - new Date(d + 'T12:00:00-03:00')) / 864e5 : 999;
const ehNovo = c => dias(c.desde) <= 7, baixou = c => c.preco_anterior && dias(c.baixou_em) <= 15;
const FONE = '5513988396022', VENDEDOR = 'Nickolas Garcia', FONE_TXT = '(13) 98839-6022';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => '&#' + c.charCodeAt(0) + ';');
const brl = v => 'R$ ' + Number(v).toLocaleString('pt-BR');
const kmf = v => v ? Number(v).toLocaleString('pt-BR') + ' km' : '0 km';
const cap = s => s.toLowerCase().replace(/(^|[\s-])\S/g, m => m.toUpperCase());
const wa = t => `https://wa.me/${FONE}?text=${encodeURIComponent(t)}`;
const anoMod = c => +String(c.ano).split('/').pop() || 0;
const imgAttr = 'referrerpolicy="no-referrer" decoding="async"';
let CARS = [], marca = '', busca = '', loja = location.hash === '#outlet' ? 'outlet' : 'carmax';
const daLoja = () => CARS.filter(c => (c.loja || 'carmax') === loja);

$('#waTop').href = wa(`Olá, ${VENDEDOR.split(' ')[0]}! Vi o catálogo da Carmax e queria mais informações.`);

function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('show'), 2200); }

function filtrados() {
  const q = busca.trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  let v = daLoja().filter(c => (!marca || (marca === '__novo' ? (ehNovo(c) || baixou(c)) : c.marca === marca)) &&
    (!q || (c.nome + ' ' + c.cor + ' ' + c.combustivel + ' ' + c.ano + ' ' + (c.cambio || '')).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').includes(q)));
  const s = $('#sort').value;
  if (s === 'asc') v.sort((a, b) => a.preco - b.preco);
  if (s === 'desc') v.sort((a, b) => b.preco - a.preco);
  if (s === 'new') v.sort((a, b) => anoMod(b) - anoMod(a) || a.km - b.km);
  if (s === 'km') v.sort((a, b) => a.km - b.km);
  return v;
}

function chips() {
  const L = daLoja(), cont = {}; L.forEach(c => cont[c.marca] = (cont[c.marca] || 0) + 1);
  const ms = Object.keys(cont).sort();
  const nNov = L.filter(c => ehNovo(c) || baixou(c)).length;
  $('#chips').innerHTML = [['', 'Todos', L.length], ...(nNov ? [['__novo', '✨ Novidades', nNov]] : []), ...ms.map(m => [m, cap(m), cont[m]])]
    .map(([v, t, n]) => `<button class="chip${v === '__novo' ? ' nov' : ''}${v === marca ? ' on' : ''}" data-m="${esc(v)}">${esc(t)}<span class="n">${n}</span></button>`).join('');
}

function render() {
  const v = filtrados();
  $('#count').textContent = v.length + (v.length === 1 ? ' veículo' : ' veículos');
  $('#list').innerHTML = v.length ? v.map(c => `
    <button class="card" data-id="${esc(c.id)}">
      <div class="ph"><img loading="lazy" ${imgAttr} src="${esc(c.fotos[0] || c.capa)}" alt="${esc(c.nome)}">
        <span class="badges">${c.km === 0 ? '<span class="tag">0 KM</span>' : ''}${ehNovo(c) ? '<span class="tag novo">CHEGOU AGORA</span>' : ''}${baixou(c) ? '<span class="tag baixou">BAIXOU O PREÇO</span>' : ''}</span>
        ${c.fotos.length > 1 ? `<span class="cnt"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="12" cy="12" r="3.2"/></svg>${c.fotos.length}</span>` : ''}</div>
      <div class="bd"><span class="mk">${esc(c.marca)}</span><span class="nm">${esc(c.modelo)}</span>
        <span class="meta"><span>${esc(c.ano)}</span><span>${kmf(c.km)}</span>${c.cambio ? `<span>${esc(c.cambio)}</span>` : ''}<span>${esc(c.combustivel)}</span></span>
        <span class="pr">${baixou(c) ? `<span class="old">${brl(c.preco_anterior)}</span>` : ''}${brl(c.preco)}</span></div>
    </button>`).join('') : '<p class="empty">Nenhum carro encontrado com esse filtro.</p>';
}

/* ---- detalhe ---- */
let atual = null;
function galeria(fotos, nome, tracked) {
  return `<div class="track" id="${tracked}">${fotos.map((f, i) => `<img ${imgAttr} ${i > 1 ? 'loading="lazy"' : ''} src="${esc(f)}" alt="${esc(nome)} — foto ${i + 1}" data-i="${i}">`).join('')}</div>`;
}
function abrir(id, push) {
  const c = CARS.find(x => x.id === id); if (!c) return;
  atual = c;
  const fotos = c.fotos.length ? c.fotos : [c.capa];
  $('#detail').innerHTML = `
    <div class="gal">${galeria(fotos, c.nome, 'gtrack')}
      <button class="gnav p" data-d="-1" aria-label="Foto anterior">‹</button><button class="gnav n" data-d="1" aria-label="Próxima foto">›</button>
      <span class="gcount" id="gc">1 / ${fotos.length}</span></div>
    ${fotos.length > 1 ? `<div class="thumbs" id="th">${fotos.map((f, i) => `<img ${imgAttr} loading="lazy" src="${esc(f)}" alt="" data-i="${i}" class="${i ? '' : 'on'}">`).join('')}</div>` : ''}
    <div class="dt">
      <span class="mk">${esc(c.marca)}</span>${c.loja === 'outlet' ? '<span class="otag">OUTLET</span>' : ''}
      <h1>${esc(c.modelo)}</h1>
      ${ehNovo(c) || baixou(c) ? `<div class="tags">${ehNovo(c) ? '<span class="tag novo">CHEGOU AGORA</span>' : ''}${baixou(c) ? '<span class="tag baixou">BAIXOU O PREÇO</span>' : ''}</div>` : ''}
      <div class="pr">${baixou(c) ? `<span class="old">${brl(c.preco_anterior)}</span>` : ''}${brl(c.preco)}</div>
      <div class="specs">
        <div class="spec"><small>Ano</small><b>${esc(c.ano)}</b></div>
        <div class="spec"><small>Quilometragem</small><b>${kmf(c.km)}</b></div>
        ${c.cambio ? `<div class="spec"><small>Câmbio</small><b>${esc(c.cambio)}</b></div>` : ''}
        <div class="spec"><small>Combustível</small><b>${esc(c.combustivel)}</b></div>
        <div class="spec"><small>Cor</small><b>${esc(c.cor)}</b></div>
      </div>
      ${c.opcionais && c.opcionais.length ? `<h2>Itens e opcionais</h2><div class="opc">${c.opcionais.map(o => `<span>${esc(o)}</span>`).join('')}</div>` : ''}
      <div class="sim" id="sim">
        <h2>Simule sua parcela</h2>
        <label for="simE">Entrada</label>
        <div class="ent"><input type="range" id="simE" min="0" max="${Math.round(c.preco * 0.9)}" step="1000" value="${Math.round(c.preco * 0.3 / 1000) * 1000}"><span class="ev" id="simEv"></span></div>
        <label>Número de parcelas</label>
        <div class="pz" id="simP">${[12, 24, 36, 48, 60].map(n => `<button data-n="${n}" class="${n === 48 ? 'on' : ''}">${n}x</button>`).join('')}</div>
        <div class="res"><small id="simL"></small><b id="simV"></b><small>Financiado: <span id="simF"></span></small></div>
        <p class="aviso">Simulação aproximada, com taxa estimada de ${String(TAXA_MES).replace('.', ',')}% ao mês. Valores sujeitos à análise de crédito e às condições do banco. Fale comigo para uma proposta real.</p>
      </div>
      <div class="seller"><div class="av">${esc(VENDEDOR[0])}</div><div><b>${esc(VENDEDOR)}</b><small>Consultor Carmax · ${FONE_TXT}</small></div></div>
      <a class="site" href="${esc(c.link)}" target="_blank" rel="noopener">Ver anúncio no site da Carmax ›</a>
    </div>`;
  $('#ctaP').textContent = brl(c.preco);
  let prazo = 48, mexeu = false;
  const sim = () => {
    const e = +$('#simE').value, f = Math.max(c.preco - e, 0), i = TAXA_MES / 100;
    const p = f ? f * i / (1 - Math.pow(1 + i, -prazo)) : 0;
    $('#simEv').textContent = brl(e); $('#simF').textContent = brl(f);
    $('#simL').textContent = prazo + 'x de aproximadamente'; $('#simV').textContent = brl(Math.round(p));
    const extra = mexeu ? `\nSimulei: entrada de ${brl(e)} em ${prazo}x de cerca de ${brl(Math.round(p))}.` : '';
    $('#ctaA').href = wa(`Olá, ${VENDEDOR.split(' ')[0]}! Tenho interesse no ${c.nome} ${c.ano} (${c.cor}) — ${brl(c.preco)}. Ainda está disponível?${extra}\n${linkCarro(c)}`);
  };
  $('#simE').addEventListener('input', () => { mexeu = true; sim(); });
  $('#simP').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; prazo = +b.dataset.n; mexeu = true; $('#simP').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); sim(); });
  sim();
  $('#sheet').scrollTop = 0;
  $('#sheet').classList.add('open'); $('#cta').classList.add('open');
  document.body.style.overflow = 'hidden';
  if (push) history.pushState({ carro: id }, '', '#carro-' + id);
  const tr = $('#gtrack');
  tr.addEventListener('scroll', () => {
    const i = Math.round(tr.scrollLeft / tr.clientWidth);
    $('#gc').textContent = (i + 1) + ' / ' + fotos.length;
    const th = $('#th'); if (th) th.querySelectorAll('img').forEach((t, j) => { t.classList.toggle('on', j === i); if (j === i) t.scrollIntoView({ block: 'nearest', inline: 'nearest' }); });
  }, { passive: true });
}
function fechar() {
  $('#sheet').classList.remove('open'); $('#cta').classList.remove('open');
  document.body.style.overflow = ''; atual = null;
}
function irFoto(i) { const tr = $('#gtrack'); tr.scrollTo({ left: i * tr.clientWidth, behavior: 'smooth' }); }

$('#detail').addEventListener('click', e => {
  const nav = e.target.closest('.gnav');
  const tr = $('#gtrack');
  if (nav) return irFoto(Math.round(tr.scrollLeft / tr.clientWidth) + +nav.dataset.d);
  const th = e.target.closest('#th img'); if (th) return irFoto(+th.dataset.i);
  const gi = e.target.closest('#gtrack img'); if (gi) abrirZoom(+gi.dataset.i);
});
function abrirZoom(i) {
  const fotos = atual.fotos.length ? atual.fotos : [atual.capa];
  $('#ztrack').innerHTML = fotos.map(f => `<img ${imgAttr} src="${esc(f)}" alt="">`).join('');
  $('#zoom').classList.add('open');
  requestAnimationFrame(() => { $('#ztrack').scrollLeft = i * $('#ztrack').clientWidth; });
}
$('#zx').onclick = () => $('#zoom').classList.remove('open');

$('#list').addEventListener('click', e => { const c = e.target.closest('.card'); if (c) abrir(c.dataset.id, true); });
$('#back').onclick = () => { if (history.state && history.state.carro) history.back(); else { fechar(); history.replaceState(null, '', loja === 'outlet' ? '#outlet' : location.pathname); } };
window.addEventListener('popstate', () => { const m = location.hash.match(/^#carro-(\w+)/); if (m) abrir(m[1], false); else { fechar(); $('#zoom').classList.remove('open'); } });
$('#share').onclick = async () => {
  if (!atual) return;
  const url = linkCarro(atual);
  const t = `${atual.nome} ${atual.ano} — ${brl(atual.preco)}`;
  try { if (navigator.share) { await navigator.share({ title: t, text: t, url }); return; } } catch (e) { if (e.name === 'AbortError') return; }
  try { await navigator.clipboard.writeText(t + '\n' + url); toast('Link do carro copiado'); } catch (e) { toast(url); }
};

$('#chips').addEventListener('click', e => { const b = e.target.closest('.chip'); if (!b) return; marca = b.dataset.m; chips(); render(); window.scrollTo({ top: 0 }); });
$('#sort').onchange = render;
function setLoja(l, hist) {
  loja = l; marca = '';
  $('#tabs').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.l === l));
  chips(); render(); window.scrollTo({ top: 0 });
  if (hist) history.replaceState(null, '', l === 'outlet' ? '#outlet' : location.pathname);
}
$('#tabs').addEventListener('click', e => { const b = e.target.closest('button'); if (b && b.dataset.l !== loja) setLoja(b.dataset.l, true); });
$('#q').addEventListener('input', e => { busca = e.target.value; $('#qx').style.display = busca ? 'block' : 'none'; render(); });
$('#qx').onclick = e => { e.preventDefault(); $('#q').value = ''; busca = ''; $('#qx').style.display = 'none'; render(); };


/* ---- pop-up de Natal: edite aqui o texto e as datas ---- */
const PROMO = {
  ativo: true,
  inicio: '2026-11-25', fim: '2027-01-06',          // aparece só entre essas datas
  titulo: 'Boas festas da Carmax! 🎄',
  texto: 'Que tal começar 2027 de carro novo? Veja nosso estoque atualizado e fale comigo pelo WhatsApp para condições de pagamento e avaliação do seu usado.',
  mensagem: 'Olá, Nickolas! Vi o catálogo de Natal da Carmax e queria saber das condições.',
  chave: 'carmax-natal-2026'                         // troque para mostrar de novo a quem já viu
};
(() => {
  const hoje = new Date().toISOString().slice(0, 10);
  if (!PROMO.ativo || hoje < PROMO.inicio || hoje > PROMO.fim || /^#carro-/.test(location.hash)) return;
  let visto = false; try { visto = localStorage.getItem(PROMO.chave) === '1'; } catch (e) {}
  if (visto) return;
  $('#promoT').textContent = PROMO.titulo; $('#promoD').textContent = PROMO.texto;
  $('#promoWa').href = wa(PROMO.mensagem);
  const fecha = () => { $('#promo').classList.remove('open'); try { localStorage.setItem(PROMO.chave, '1'); } catch (e) {} };
  $('#promoX').onclick = fecha; $('#promoOk').onclick = fecha; $('#promoWa').addEventListener('click', fecha);
  $('#promo').addEventListener('click', e => { if (e.target.id === 'promo') fecha(); });
  setTimeout(() => $('#promo').classList.add('open'), 700);
})();

fetch('estoque.json?v=' + Date.now()).then(r => r.json()).then(d => {
  CARS = d.carros.map(c => ({ ...c, fotos: (c.fotos && c.fotos.length ? c.fotos : [c.capa]).filter(Boolean) }));
  $('#foot').innerHTML = `Atualizado automaticamente em ${esc(d.atualizado)}<br>Preços e disponibilidade sujeitos a alteração. Fale com ${esc(VENDEDOR)} · <a href="${wa('Olá!')}" target="_blank" rel="noopener">${FONE_TXT}</a>`;
  $('#nC').textContent = CARS.filter(c => (c.loja || 'carmax') === 'carmax').length;
  $('#nO').textContent = CARS.filter(c => c.loja === 'outlet').length;
  const m0 = location.hash.match(/^#carro-(\w+)/), c0 = m0 && CARS.find(c => c.id === m0[1]);
  if (c0) loja = c0.loja || 'carmax';
  $('#tabs').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.l === loja));
  chips(); render();
  const m = location.hash.match(/^#carro-(\w+)/); if (m) abrir(m[1], false);
}).catch(() => { $('#list').innerHTML = '<p class="empty">Não foi possível carregar o estoque agora. Tente de novo em instantes.</p>'; $('#count').textContent = ''; });
}
</script>
</body>
</html>
