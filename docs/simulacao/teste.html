<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="robots" content="noindex"><title>teste</title>
<style>#ops{display:none;border:1px solid #999}#ops div{padding:4px}</style></head><body>
<div><label>CPF/CNPJ</label><input id="a"></div>
<div><label>Placa</label><input id="b" disabled maxlength="8"></div>
<div id="cb" role="combobox" style="display:none;border:1px solid;padding:6px;width:300px"><span class="mat-mdc-select-value-text"></span> Marca, modelo e versão</div>
<div id="ops"><div role="option">VOLKSWAGEN T-CROSS 1.4 HIGHLINE 2022</div><div role="option">TOYOTA COROLLA 2.0 XEI 2023</div><div role="option">TOYOTA COROLLA 2.0 GLI 2023</div></div>
<div id="w" style="display:none"><label>Valor do veículo</label><input id="c"></div>
<script>
a.addEventListener('input',()=>{if(a.value.replace(/\D/g,'').length===11)setTimeout(()=>{b.disabled=false;setTimeout(()=>{b.value=''},400)},800)});
b.addEventListener('input',()=>{if(b.value.replace(/\W/g,'').length===7)setTimeout(()=>cb.style.display='',800)});
cb.addEventListener('click',()=>ops.style.display='block');
ops.addEventListener('click',e=>{const o=e.target.closest('[role=option]');cb.querySelector('span').textContent=o.textContent;ops.style.display='none';setTimeout(()=>w.style.display='',500)});
</script></body></html>
