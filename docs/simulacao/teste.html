<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="robots" content="noindex"><title>teste</title></head><body>
<input placeholder="Busca por nome, proposta, CPF ou CNPJ" id="busca">
<div><label for="a">CPF do cliente</label><input id="a" maxlength="14"></div>
<div><label>Nome completo</label><input id="b"></div>
<div><label>Nome da mãe</label><input id="m"></div>
<div><label>Data de nascimento</label><input id="c" maxlength="10"></div>
<div><label>Celular</label><input id="d" type="tel"></div>
<div><label>Placa</label><input id="e"></div>
<div><label>Valor do veículo</label><input id="f"></div>
<div><label>Valor de entrada</label><input id="g"></div>
<script>
// máscara simples tipo ngx-mask no CPF: reformata no input
a.addEventListener('input',()=>{let v=a.value.replace(/\D/g,'').slice(0,11);a.value=v.replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d{1,2})$/,'$1-$2')});
// máscara de moeda tipo ng2-currency-mask (keypress)
f.addEventListener('keypress',e=>{if(!/\d/.test(e.key))return;e.preventDefault();let d=(f.value.replace(/\D/g,'')+e.key).replace(/^0+/,'');d=d.padStart(3,'0');f.value='R$ '+(+d.slice(0,-2)).toLocaleString('pt-BR')+','+d.slice(-2)});
</script></body></html>
